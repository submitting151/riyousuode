<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日有所得体验统计</title><script src="./config.js"></script><style>body{font:16px system-ui;max-width:620px;margin:4rem auto;padding:0 1.25rem;color:#403443;background:#faf6f9}section{background:white;padding:1.5rem;border-radius:18px;margin:1rem 0}input,button{font:inherit;padding:.7rem;border:1px solid #d8cbd9;border-radius:10px}input{width:100%;box-sizing:border-box}button{background:#755d80;color:white;cursor:pointer;margin-top:1rem}p{line-height:1.6}dt{margin-top:1rem}dd{margin:.4rem 0 0;font-size:1.3rem}</style></head><body><h1>日有所得体验统计</h1><p>只显示同意统计的浏览器设备；数据不是去重后的真实用户数。</p><section><label for="admin">统计查看码</label><input id="admin" type="password" autocomplete="off"><button id="show">查看统计</button><p id="status" role="status"></p><dl id="result"></dl></section><p>仅统计最近 30 天。体验者可在设置中关闭并请求删除；小样本结果不代表总体。当前免费数据库将到期，需提前导出。</p><script>
document.querySelector('#show').onclick=async()=>{const status=document.querySelector('#status'),box=document.querySelector('#result'),code=document.querySelector('#admin').value;status.textContent='正在读取…';box.replaceChildren();try{let r=await fetch(window.DIARY_API_BASE+'/metrics/summary',{method:'POST',headers:{'Content-Type':'application/json','X-Metrics-Admin':code},body:'{}'});if(!r.ok)throw Error(r.status===403?'查看码不正确':'统计服务暂不可用');let d=(await r.json()).data;const pairs=[['开始首次记录的设备',d.first_started+' 台'],['完成首次记录的设备',d.first_saved+' 台'],['首次记录完成率',d.first_started?(100*d.first_saved/d.first_started).toFixed(1)+'%（'+d.first_saved+'/'+d.first_started+'）':'暂无数据'],['发起转写',d.transcribe_started+' 次'],['转写成功',d.transcribe_succeeded+' 次'],['转写成功率',d.transcribe_started?(100*d.transcribe_succeeded/d.transcribe_started).toFixed(1)+'%（'+d.transcribe_succeeded+'/'+d.transcribe_started+'）':'暂无数据'],['体验反馈','顺畅 '+(d.feedback.smooth||0)+' · 一般 '+(d.feedback.average||0)+' · 遇到问题 '+(d.feedback.difficulty||0)]];for(const [name,value] of pairs){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value;box.append(dt,dd)}status.textContent='统计已更新。'}catch(e){status.textContent=e.message}};
</script></body></html>
